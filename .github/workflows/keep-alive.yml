# Free Supabase projects pause after 7 days without activity. This calls the
# public region_outline() function (anon key, read-only) twice a week so the
# demo stays awake, and fails loudly if the database isn't answering properly.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the same public anon key Vercel uses
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call region_outline()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          body=$(curl --silent --show-error --fail --max-time 60 --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/region_outline" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          regions=$(echo "$body" | jq '(.features // []) | length')
          echo "Regions returned: $regions"
          if [ "$regions" -lt 1 ]; then
            echo "::error::region_outline() returned no regions; the layers may not be loaded."
            exit 1
          fi
